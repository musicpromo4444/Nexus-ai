name: Build Nexus ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package project
        run: |
          zip -r nexus-ai-project.zip . -x "node_modules/*" ".git/*" "dist/*" "nexus-ai-project.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-project
          path: nexus-ai-project.zip
          retention-days: 7
